<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kostky</title>
<meta name="description" content="Kostky : le jeu de dés des tavernes de Bohême, à plusieurs en ligne ou contre des robots.">
<meta name="theme-color" content="#140d09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kostky">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=UnifrakturMaguntia&display=swap">
<style>
/* Une table de taverne bohémienne à la chandelle : chêne noirci, plateau de cuir sang-de-bœuf,
   dés en os, laiton des insignes, ardoise pour les comptes. */
:root {
  --night: #140d09;
  --oak: #2a1a11;
  --oak-hi: #3c2717;
  --oak-line: #5a3b22;
  --leather: #5a2118;
  --leather-hi: #7a3022;
  --bone: #efe3c6;
  --bone-dim: #b8a585;
  --bone-faint: #8a7a60;
  --brass: #d6a54c;
  --brass-hi: #f1cf7c;
  --brass-deep: #8a6223;
  --blood: #d04a33;
  --moss: #9cc184;
  --slate: #22282a;
  --slate-hi: #2e3537;
  --chalk: #ece8dc;
  --ink: #1b110b;
  --shadow: rgba(0, 0, 0, .55);

  --f-display: 'UnifrakturMaguntia', 'Pirata One', 'Old English Text MT', Georgia, serif;
  --f-body: 'Alegreya', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --f-label: 'Alegreya SC', 'Alegreya', 'Palatino Linotype', Georgia, serif;

  --r-s: 6px;
  --r-m: 10px;
  --tray: clamp(240px, min(100vw - 54px, 50dvh), 400px);
  --ds: calc(var(--tray) * .158);
  --dock-h: 150px;
  --table-img: repeating-linear-gradient(180deg, #4a2c17 0 78px, #22130a 78px 80px);
  --tray-img: linear-gradient(#5a3519, #3c2210);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-x: hidden; }
body {
  margin: 0;
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  color: var(--bone);
  background-color: var(--night);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
/* La table de la taverne : planches de chêne sombre, lueur de chandelle, coins dans l'ombre. */
body::before, body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; }
body::before {
  background-color: #2a180c;
  background-image:
    radial-gradient(ellipse 120% 90% at 50% 38%, transparent 35%, rgba(8, 4, 2, .78) 100%),
    linear-gradient(180deg, rgba(14, 8, 4, .5), rgba(14, 8, 4, .3) 30%, rgba(14, 8, 4, .55)),
    var(--table-img);
  background-size: auto, auto, 600px auto;
}
body::after { /* chandelle */
  background: radial-gradient(ellipse 75% 50% at 50% 30%, rgba(255, 170, 80, .17), transparent 70%);
  animation: candle 5s ease-in-out infinite alternate;
}
@keyframes candle { 0% { opacity: .75; } 30% { opacity: 1; } 55% { opacity: .85; } 80% { opacity: .98; } 100% { opacity: .8; } }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
a { color: var(--brass-hi); }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
.hidden { display: none !important; }
.screen { min-height: 100%; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: lining-nums tabular-nums; }
.label { font-family: var(--f-label); letter-spacing: .06em; text-transform: lowercase; font-weight: 500; color: var(--bone-dim); font-size: 15px; }
.hint { color: var(--bone-dim); font-size: 15px; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: var(--r-s);
  font-family: var(--f-label); font-weight: 700; font-size: 17px; letter-spacing: .04em;
  border: 1px solid var(--oak-line); background: linear-gradient(180deg, var(--oak-hi), var(--oak));
  color: var(--bone); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 2px 0 rgba(0, 0, 0, .4);
  transition: transform .08s, filter .15s, background .15s;
  text-align: center; line-height: 1.1;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .42; cursor: not-allowed; filter: grayscale(.4); transform: none; }
.btn.gold {
  color: var(--ink); border-color: var(--brass-deep);
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 55%, var(--brass-deep));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -2px 0 rgba(0, 0, 0, .2), 0 2px 0 rgba(0, 0, 0, .45);
  text-shadow: 0 1px 0 rgba(255, 255, 255, .3);
}
.btn.blood { color: var(--bone); border-color: #6b1d12; background: linear-gradient(180deg, #b23b27, #7b2416); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--bone-dim); min-height: 40px; padding: 0 10px; font-size: 15px; }
.btn.ghost:hover { color: var(--bone); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 15px; }
.btn.big { min-height: 54px; font-size: 19px; }
.btn.full { width: 100%; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%; display: inline-grid; place-items: center;
  border: 1px solid var(--oak-line); background: rgba(0, 0, 0, .25); color: var(--bone-dim);
}
.icon-btn:hover { color: var(--bone); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="false"] { opacity: .55; }

/* ---------- Champs ---------- */
.field { display: grid; gap: 6px; }
.field input, input.txt {
  height: 48px; padding: 0 14px; border-radius: var(--r-s);
  background: rgba(0, 0, 0, .35); border: 1px solid var(--oak-line); color: var(--bone);
  font-size: 18px; width: 100%; min-width: 0;
}
.field input::placeholder { color: var(--bone-faint); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 140px; min-width: 0; }

/* ---------- Accueil ---------- */
#home { display: grid; place-items: center; padding-block: 28px 40px; }
.home-card { width: min(440px, 100%); display: grid; gap: 18px; }
.brand { text-align: center; display: grid; gap: 4px; justify-items: center; }
.brand h1 {
  font-family: var(--f-display); font-size: clamp(64px, 19vw, 104px); line-height: .9; color: var(--bone);
  text-shadow: 0 0 22px rgba(255, 170, 70, .28), 0 3px 0 rgba(0, 0, 0, .6);
  letter-spacing: .01em;
}
.brand .tag { font-family: var(--f-label); color: var(--brass); letter-spacing: .14em; text-transform: lowercase; font-size: 16px; }
.brand .czech { font-style: italic; color: var(--bone-dim); font-size: 15px; }
.home-dice { display: flex; justify-content: center; gap: 12px; margin: 6px 0 2px; }
.home-dice img { width: 54px; height: 54px; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .55)); }
.home-dice img:nth-child(1) { transform: rotate(-14deg) translateY(4px); }
.home-dice img:nth-child(2) { transform: rotate(6deg) translateY(-3px); }
.home-dice img:nth-child(3) { transform: rotate(19deg) translateY(5px); }
.panel {
  background: linear-gradient(180deg, rgba(60, 39, 23, .92), rgba(36, 23, 14, .94));
  border: 1px solid var(--oak-line); border-radius: var(--r-m);
  box-shadow: inset 0 1px 0 rgba(255, 220, 160, .07), 0 18px 40px rgba(0, 0, 0, .45);
  padding: 18px; display: grid; gap: 14px;
}
.sep { display: flex; align-items: center; gap: 12px; color: var(--bone-faint); font-family: var(--f-label); font-size: 14px; }
.sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--oak-line); }
.code-input { text-transform: uppercase; letter-spacing: .3em; font-family: var(--f-label); font-weight: 700; text-align: center; }
.credit { font-size: 13.5px; color: var(--bone-faint); line-height: 1.5; text-align: center; }
.resume { border: 1px dashed var(--brass-deep); border-radius: var(--r-s); padding: 12px; display: grid; gap: 8px; }

/* ---------- Salon ---------- */
#lobby, #setup { padding-block: 18px 120px; }
.page { width: min(720px, 100%); margin: 0 auto; display: grid; gap: 16px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-family: var(--f-display); font-size: 42px; line-height: 1; }
.code-box { display: grid; gap: 4px; justify-items: end; }
.code-box .code { font-family: var(--f-label); font-weight: 700; font-size: 34px; letter-spacing: .28em; color: var(--brass-hi); line-height: 1; }
.seat-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.seat {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-s);
  background: rgba(0, 0, 0, .25); border: 1px solid rgba(90, 59, 34, .7);
}
.seat .n { font-family: var(--f-label); color: var(--bone-faint); width: 1.4em; text-align: center; }
.seat .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; }
.chip { font-family: var(--f-label); font-size: 13px; letter-spacing: .05em; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--oak-line); color: var(--bone-dim); white-space: nowrap; }
.chip.host { border-color: var(--brass-deep); color: var(--brass-hi); }
.chip.off { border-color: #6b1d12; color: #e7826f; }
.chip.ok { border-color: #456b39; color: var(--moss); }
.opt { display: grid; gap: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  min-height: 40px; padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--oak-line);
  background: rgba(0, 0, 0, .25); color: var(--bone-dim); font-family: var(--f-label); font-weight: 500; font-size: 16px;
}
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: var(--ink); border-color: var(--brass-deep); font-weight: 700; }
.seg button[disabled] { cursor: default; }
.opt-note { font-size: 14px; color: var(--bone-faint); }
.sticky-foot {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(20, 13, 9, 0), rgba(20, 13, 9, .92) 30%);
}
.sticky-foot .inner { width: min(720px, 100%); margin: 0 auto; display: flex; gap: 10px; }
.sticky-foot .inner > * { flex: 1; }

/* ---------- Préparation ---------- */
.bag-slots { display: flex; gap: 8px; flex-wrap: wrap; }
.bag-slots img { width: 44px; height: 44px; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .5)); }
.bag-count { font-family: var(--f-label); color: var(--brass-hi); }
.die-list { display: grid; gap: 6px; }
.die-row {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: var(--r-s); background: rgba(0, 0, 0, .22); border: 1px solid rgba(90, 59, 34, .6);
}
.die-row img { width: 40px; height: 40px; }
.die-row .meta { min-width: 0; display: grid; gap: 2px; }
.die-row .nm { font-weight: 700; font-size: 16px; line-height: 1.2; }
.die-row .ds { font-size: 14px; color: var(--bone-dim); line-height: 1.3; }
.probs { display: flex; gap: 3px; align-items: flex-end; height: 22px; margin-top: 2px; }
.probs span { width: 14px; background: var(--brass); border-radius: 2px 2px 0 0; position: relative; min-height: 1px; opacity: .85; }
.probs span i { position: absolute; bottom: -15px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 11px; color: var(--bone-faint); }
.probs-wrap { padding-bottom: 14px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--oak-line); background: rgba(0, 0, 0, .3); font-size: 20px; line-height: 1; }
.stepper button[disabled] { opacity: .3; }
.stepper b { width: 22px; text-align: center; font-family: var(--f-label); font-size: 18px; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
.badge-card {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left;
  padding: 8px 10px; border-radius: var(--r-s); background: rgba(0, 0, 0, .22); border: 1px solid rgba(90, 59, 34, .6);
}
.badge-card[aria-pressed="true"] { border-color: var(--brass); background: rgba(214, 165, 76, .12); box-shadow: 0 0 0 1px var(--brass) inset; }
.badge-card .medal { width: 30px; height: 30px; }
.badge-card .bn { font-weight: 700; line-height: 1.15; font-size: 14.5px; hyphens: auto; -webkit-hyphens: auto; }
.badge-card .bt { font-family: var(--f-label); font-size: 12.5px; color: var(--bone-faint); }
.badge-detail { font-size: 15px; color: var(--bone-dim); min-height: 2.9em; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }

/* Médaillons d'insigne */
.medal {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none;
  color: #20160d; position: relative;
  box-shadow: inset 0 2px 2px rgba(255, 255, 255, .5), inset 0 -3px 4px rgba(0, 0, 0, .35), 0 2px 4px rgba(0, 0, 0, .5);
}
.medal svg { width: 58%; height: 58%; }
.medal.t1 { background: radial-gradient(circle at 35% 30%, #d9dcdf, #8d9398 60%, #5d6267); }
.medal.t2 { background: radial-gradient(circle at 35% 30%, #ffffff, #c4ccd3 55%, #7e8890); }
.medal.t3 { background: radial-gradient(circle at 35% 30%, #fff1b8, #e1b04a 55%, #8f6418); }
.medal.off { filter: grayscale(1) brightness(.6); }
.medal.off::after { content: ""; position: absolute; inset: 45% -6% auto; height: 3px; background: var(--blood); transform: rotate(-35deg); border-radius: 2px; }
.medal .uses { position: absolute; right: -4px; bottom: -4px; min-width: 19px; height: 19px; border-radius: 10px; background: var(--ink); color: var(--brass-hi); font: 700 12px/19px var(--f-label); text-align: center; border: 1px solid var(--brass-deep); padding: 0 4px; }
.medal.none { background: rgba(0, 0, 0, .3); box-shadow: inset 0 0 0 1px var(--oak-line); color: var(--bone-faint); }

/* ---------- Jeu ---------- */
#game { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.main { display: grid; gap: 10px; align-content: start; padding-block: 8px calc(var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px)); width: min(640px, 100%); margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 8px; }
.topbar .brand-s { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--bone); }
.topbar .goal { flex: 1; min-width: 0; font-family: var(--f-label); color: var(--bone-dim); font-size: 14.5px; line-height: 1.2; }
.topbar .goal b { color: var(--brass-hi); font-weight: 700; }

/* Ardoise des scores */
.slate {
  background: linear-gradient(170deg, var(--slate-hi), var(--slate));
  border-radius: 8px; padding: 8px;
  border: 5px solid #4a3020; border-image: none;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .5), inset 0 0 30px rgba(0, 0, 0, .35), 0 6px 16px rgba(0, 0, 0, .45);
  display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px;
}
.pl {
  position: relative; padding: 6px 8px 8px; border-radius: 5px; color: var(--chalk);
  display: grid; gap: 0; min-width: 0; border: 1px solid transparent;
}
.pl.cur { border-color: rgba(241, 207, 124, .55); background: rgba(241, 207, 124, .07); }
.pl .nm { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; color: rgba(236, 232, 220, .85); }
.pl .nm .flame { color: var(--brass-hi); flex: none; }
.pl .sc { font-size: 26px; line-height: 1.05; font-weight: 500; text-shadow: 0 0 1px rgba(236, 232, 220, .6); }
.pl .bar { height: 3px; border-radius: 2px; background: rgba(236, 232, 220, .12); margin-top: 3px; overflow: hidden; }
.pl .bar i { display: block; height: 100%; background: rgba(236, 232, 220, .75); border-radius: 2px; transition: width .5s; }
.pl .nm .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pl .tags { margin-left: auto; display: flex; gap: 3px; align-items: center; flex: none; }
.pl .tags .medal { width: 18px; height: 18px; box-shadow: 0 1px 1px rgba(0, 0, 0, .6); }
.pl .tags .medal svg { width: 62%; height: 62%; }
.pl .tags .medal .uses { display: none; }
.pl .tag-t { font-family: var(--f-label); font-size: 12px; color: rgba(236, 232, 220, .5); line-height: 1; margin-top: 3px; }
.pl.away .nm { text-decoration: line-through; text-decoration-color: rgba(208, 74, 51, .7); }
.pl.done-final { opacity: .55; }

/* Bandeau du tour */
.turnline { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding: 0 2px; min-height: 52px; }
.turnline .who { font-size: 17px; color: var(--bone-dim); line-height: 1.2; min-width: 0; }
.turnline .who b { color: var(--bone); font-weight: 700; font-size: 21px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turnline .pot { text-align: right; flex: none; }
.turnline .pot .label { display: block; }
.turnline .pot .v { font-size: 34px; line-height: 1; color: var(--brass-hi); font-weight: 700; }
.turnline .pot .v small { font-size: 15px; color: var(--moss); font-weight: 500; margin-left: 4px; }

/* Plateau */
.tray-stage { display: grid; place-items: center; perspective: 900px; perspective-origin: 50% 0%; padding: 4px 0 calc(var(--tray) * .06); overflow-x: clip; overflow-clip-margin: 0px; }
/* Plateau carré : cadre de chêne clair, fond de noyer. */
.tray {
  width: var(--tray); height: var(--tray); border-radius: 3px; position: relative;
  transform: rotateX(24deg); transform-style: preserve-3d;
  background: #6b4424 var(--tray-img) center / 100% 100%;
  box-shadow: 0 5px 0 #6e4a26, 0 9px 0 #3b2411, 0 16px 18px rgba(0, 0, 0, .55);
}
.tray::before { /* creux du plateau */
  content: ""; position: absolute; inset: 7.5%; pointer-events: none;
  box-shadow: inset 0 3px 8px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(0, 0, 0, .45);
}
:root:not(.tex) .tray::before { background: radial-gradient(circle at 50% 40%, #5c3519, #2e180a); box-shadow: inset 0 6px 16px rgba(0, 0, 0, .6); }

.die-pos { position: absolute; left: 0; top: 0; width: var(--ds); height: var(--ds); transform-style: preserve-3d; cursor: pointer; }
.die-pos .shadow {
  position: absolute; inset: 8%; border-radius: 22%; background: rgba(0, 0, 0, .55); filter: blur(5px);
  transform: translate3d(10%, 12%, 0); transition: opacity .3s;
}
.die-pos .ring {
  position: absolute; inset: -14%; border-radius: 26%; border: 3px solid var(--brass-hi);
  box-shadow: 0 0 14px rgba(241, 207, 124, .65), inset 0 0 10px rgba(241, 207, 124, .45);
  opacity: 0; transition: opacity .15s;
}
.die-pos.sel .ring { opacity: 1; }
.die-pos.bsel .ring { opacity: 1; border-color: #8fd0ff; box-shadow: 0 0 14px rgba(143, 208, 255, .6); }
.die-pos.peek .ring { opacity: .8; border-style: dashed; }
.cube {
  position: absolute; inset: 0; transform-style: preserve-3d;
}
.cube .f {
  position: absolute; inset: 0; background-size: 100% 100%; backface-visibility: hidden;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
}
.cube .f.shd { filter: brightness(.68); }
.die-pos.dim .cube .f { filter: brightness(.5) saturate(.5); }
.die-pos.dim .cube .f.shd { filter: brightness(.36) saturate(.5); }
.tray.bust .cube .f { filter: brightness(.55) saturate(.3); }
.tray.bust .cube .f.shd { filter: brightness(.4) saturate(.3); }
.die-pos.extra .ring { border-color: var(--moss); }
.tray-cta { position: absolute; inset: 7.5%; display: grid; place-items: center; transform: translateZ(2px); }
.tray-cta .msg { text-align: center; color: var(--bone); max-width: 80%; text-shadow: 0 1px 3px rgba(0, 0, 0, .8); display: grid; gap: 10px; justify-items: center; }
.tray-cta .msg .big { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--bone); text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
.stamp {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) translateZ(60px) rotate(-12deg) scale(1);
  font-family: var(--f-display); font-size: calc(var(--tray) * .15); line-height: 1; white-space: nowrap;
  padding: 6px 18px; border: 4px double currentColor; border-radius: 8px; pointer-events: none;
  background: rgba(20, 13, 9, .78); text-shadow: 0 2px 0 rgba(0, 0, 0, .6);
  animation: stampIn .35s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp.bust { color: var(--blood); }
.stamp.hot { color: var(--brass-hi); rotate: 8deg; }
.stamp.bank { color: var(--moss); font-family: var(--f-label); font-weight: 700; letter-spacing: .04em; rotate: 6deg; }
.stamp.out { animation: stampOut .5s ease-in both; }
.tray.picking .stamp.bust { opacity: .12; }
@keyframes stampIn { from { opacity: 0; transform: translate(-50%, -50%) translateZ(60px) rotate(-12deg) scale(1.6); } to { opacity: 1; } }
@keyframes stampOut { to { opacity: 0; transform: translate(-50%, -60%) translateZ(60px) rotate(-12deg) scale(.9); } }

/* Dés mis de côté */
.kept { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; min-height: 58px; scrollbar-width: thin; align-items: stretch; }
.kept .grp {
  display: grid; gap: 3px; justify-items: center; padding: 5px 8px; border-radius: var(--r-s);
  background: rgba(0, 0, 0, .28); border: 1px solid rgba(90, 59, 34, .7); flex: none;
}
.kept .grp .dd { display: flex; gap: 3px; }
.kept .grp img { width: 24px; height: 24px; }
.kept .grp .pt { font-family: var(--f-label); font-size: 13px; color: var(--brass-hi); line-height: 1; }
.kept .grp.dbl .pt::after { content: " ×2"; color: var(--moss); }
.kept .empty { color: var(--bone-faint); font-size: 14.5px; align-self: center; padding-left: 4px; }

/* Dock d'action */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, rgba(42, 26, 17, .97), rgba(24, 15, 9, .99));
  border-top: 1px solid var(--oak-line); box-shadow: 0 -10px 30px rgba(0, 0, 0, .45);
}
.dock .inner { width: min(640px, 100%); margin: 0 auto; display: grid; gap: 8px; }
.dock .info { display: flex; align-items: center; gap: 10px; min-height: 42px; }
.dock .info .txt { flex: 1; min-width: 0; font-size: 16px; line-height: 1.3; }
.dock .info .txt b { color: var(--brass-hi); }
.dock .info .txt .bad { color: #ec8a75; }
.dock .info .txt .good { color: var(--moss); }
.dock .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dock .acts.one { grid-template-columns: 1fr; }
.dock .medal-btn { border: 0; padding: 0; background: none; border-radius: 50%; }
.dock .chipbtn {
  min-height: 34px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--oak-line); background: rgba(0, 0, 0, .3);
  font-family: var(--f-label); font-size: 14px; color: var(--bone-dim); white-space: nowrap;
}
.dock .chipbtn[aria-pressed="true"] { border-color: var(--moss); color: var(--moss); background: rgba(156, 193, 132, .1); }

/* Journal */
.side { display: none; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 78dvh; overflow: auto;
  background: linear-gradient(180deg, #2e1d12, #1a110a); border-top: 1px solid var(--oak-line);
  border-radius: 14px 14px 0 0; box-shadow: 0 -20px 40px rgba(0, 0, 0, .5);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 14px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.sheet .inner { width: min(640px, 100%); margin: 0 auto; display: grid; gap: 12px; }
.sheet h3 { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.loglist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; }
.loglist li { padding: 4px 0; border-bottom: 1px solid rgba(90, 59, 34, .45); color: var(--bone-dim); line-height: 1.35; }
.loglist li.turn { color: var(--bone-faint); font-family: var(--f-label); font-size: 13.5px; border-bottom: 0; padding-top: 8px; }
.loglist li.bank { color: var(--moss); }
.loglist li.bust { color: #e7826f; }
.loglist li.hot, .loglist li.badge { color: var(--brass-hi); }
.loglist li.win { color: var(--brass-hi); font-weight: 700; }

@media (min-width: 980px) {
  #game { grid-template-columns: minmax(0, 1fr) 320px; }
  .side {
    display: grid; align-content: start; gap: 10px; position: sticky; top: 0; height: 100dvh; overflow: auto;
    padding: 14px 16px calc(var(--dock-h) + 20px); border-left: 1px solid rgba(90, 59, 34, .6); background: rgba(0, 0, 0, .18);
  }
  .side h3 { font-family: var(--f-display); font-size: 28px; }
  .only-narrow { display: none !important; }
  .dock { right: 320px; }
}

/* Superpositions (règles, fin de partie, confirmations) */
.ov { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8, 5, 3, .72); padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.ov .card {
  width: min(680px, 100%); max-height: 100%; overflow: auto; border-radius: var(--r-m);
  background: linear-gradient(180deg, #33200f, #1d1209); border: 1px solid var(--oak-line);

}
.ov .card.parch { background: linear-gradient(180deg, #ecdcb7, #dcc697); color: #2a1a0e; border-color: #a8884f; }
.ov .card.parch a { color: #7b3415; }
.ov .card.parch h2, .ov .card.parch h3 { color: #3d1f0d; }
.ov .card.parch .hint, .ov .card.parch .muted { color: #5e4a30; }
.ov .card.parch table td, .ov .card.parch table th { border-color: rgba(90, 59, 34, .3); }
.ov .card.parch .icon-btn { color: #3d1f0d; border-color: rgba(90, 59, 34, .45); background: rgba(255, 248, 230, .55); }
.ov .card h2 { font-family: var(--f-display); font-size: 44px; line-height: 1; }
.ov .card h3 { font-family: var(--f-label); font-weight: 700; font-size: 20px; letter-spacing: .03em; margin-top: 6px; }
.ov .card p { margin: 0; }
.rules { display: grid; gap: 10px; font-size: 16.5px; }
.rules ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.tbl-wrap { overflow-x: auto; }
.rules table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
.rules td, .rules th { border-bottom: 1px solid; padding: 6px 6px; text-align: left; vertical-align: middle; }
.rules th { font-family: var(--f-label); font-weight: 700; }
.rules td.pts { text-align: right; font-weight: 700; white-space: nowrap; }
.mini { display: inline-flex; gap: 2px; vertical-align: middle; }
.mini img { width: 22px; height: 22px; }
.close-x { position: sticky; top: 0; justify-self: end; margin: -8px -8px -40px 0; z-index: 2; }
.win-head { text-align: center; display: grid; gap: 6px; }
.win-head .crown { color: var(--brass-hi); }
.win-head h2 { color: var(--brass-hi); font-size: 54px; }
.statt { width: 100%; border-collapse: collapse; font-size: 15px; }
.statt th, .statt td { padding: 6px 4px; border-bottom: 1px solid rgba(90, 59, 34, .6); text-align: right; }
.statt th { font-size: 13px; line-height: 1.15; vertical-align: bottom; }
.statt th:first-child, .statt td:first-child { text-align: left; }
.statt th { font-family: var(--f-label); color: var(--bone-dim); font-weight: 500; }
.statt tr.w td { color: var(--brass-hi); font-weight: 700; }

/* Notifications */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 90; display: grid; gap: 6px; width: min(460px, calc(100% - 32px)); pointer-events: none; }
.toast { background: #2a1a10; border: 1px solid var(--oak-line); border-left: 4px solid var(--brass); padding: 10px 12px; border-radius: var(--r-s); box-shadow: 0 10px 24px rgba(0, 0, 0, .5); font-size: 15.5px; animation: tIn .25s ease-out; }
.toast.bad { border-left-color: var(--blood); }
@keyframes tIn { from { opacity: 0; transform: translateY(-8px); } }
#netbanner { position: fixed; left: 0; right: 0; top: 0; z-index: 80; background: #6b1d12; color: var(--bone); text-align: center; font-size: 15px; padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }

@media (max-width: 420px) {
  body { font-size: 16px; }
  .turnline .pot .v { font-size: 30px; }
  .pl .sc { font-size: 23px; }
  .btn.big { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  body::after { animation: none; }
  .cube { transition-duration: 1ms !important; }
  .stamp { animation: none; }
}

const DICE_ORDER = Object.keys(DICE);

/* ---------- Insignes ----------

const TIERS = { 1: 'étain', 2: 'argent', 3: 'or' };
const BADGES = {

const KIND_NAME = { 3: 'Brelan', 4: 'Carré', 5: 'Cinq', 6: 'Six', 7: 'Sept' };

function setName(n, v) {
  if (n === 3) return 'Brelan de ' + v;
  if (n === 4) return 'Carré de ' + v;
  return (KIND_NAME[n] || n) + ' × ' + v;

/* Meilleur score en utilisant TOUS les dés (counts[0] = jokers). null si impossible. */
function bestCounts(c, ctx, memo) {
  const key = c.join('');
  if (memo.has(key)) return memo.get(key);
  let v = 1;

/* ---------- Partie ---------- */
const MIN_PLAYERS = 2, MAX_PLAYERS = 6;

function beginTurn(S) {

/* ================= Sons =================
   Tout est synthétisé : dés secoués dans un cornet de cuir, puis chocs sur le plateau de bois. */
const SND = { ctx: null, on: LS.get('kostky-sound') !== '0', noise: null, white: null, out: null };
function audio() {

  const c = SND.ctx;
  if (c.state === 'suspended') c.resume().catch(() => { });

    SND.white = mk(.6, () => 1);
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    const g = c.createGain(); g.gain.value = .9;
    comp.connect(g); g.connect(c.destination);
    SND.out = comp;
  }

}
// Choc d'un dé sur le bois : un « toc » résonant et un bref coup sourd.
function woodHit(at, g, f) {

  lp.type = 'lowpass'; lp.frequency.value = 3200;

  s.connect(bp); bp.connect(lp); lp.connect(gn); gn.connect(SND.out); s.start(at); s.stop(at + .06);
  const o = c.createOscillator(), og = c.createGain();

// Cornet de cuir secoué : un froissement étouffé et des petits chocs assourdis.
function leatherShake(at, dur, n) {
  const c = SND.ctx;
  const s = c.createBufferSource(), lp = c.createBiquadFilter(), bp = c.createBiquadFilter(), gn = c.createGain();
  s.buffer = SND.white; lp.type = 'lowpass'; lp.frequency.value = 900; bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = .8;

  gn.gain.linearRampToValueAtTime(0, at + dur);
  s.connect(lp); lp.connect(bp); bp.connect(gn); gn.connect(SND.out); s.start(at); s.stop(at + dur + .02);
  for (let i = 0; i < n * 2; i++) {
    const t = at + Math.random() * dur, b = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    b.buffer = SND.noise; f.type = 'lowpass'; f.frequency.value = 700 + Math.random() * 500;
    g.gain.setValueAtTime(.25 + Math.random() * .2, t); g.gain.exponentialRampToValueAtTime(.0008, t + .04);

}
// Un dé qui tombe, rebondit puis se pose (calé sur l'animation du plateau).
function dieLand(at, g, pitch, bounce) {
  woodHit(at, g, pitch);
  let t = at + bounce, a = g * .45;
  for (let k = 0; k < 3; k++) { woodHit(t, a, pitch * (1 + (Math.random() - .5) * .12)); t += .045 * Math.pow(.6, k) + .01; a *= .4; }
}
function sRoll(n, reroll) {
  if (!SND.on || !audio()) return;
  const t0 = SND.ctx.currentTime + .02, ms = ROLL_MS / 1000;
  if (!reroll) leatherShake(t0, .32, n);
  for (let i = 0; i < n; i++) {
    const pitch = 750 + Math.random() * 900;
    if (reroll) dieLand(t0 + ms * .8 - .02 + i * .03, .5, pitch, .05);

// Coups de poing sur la table : pour inscrire ses points.

  s.buffer = SND.noise; bp.type = 'bandpass'; bp.frequency.value = 260; bp.Q.value = 4;

function sHot() {
  if (!SND.on || !audio()) return;

/* ================= Hôte : arbitrage ================= */
function hlog(s, k) { E.log(S, s, k || 'sys'); }
function cleanName(n) { return String(n || '').replace(/\s+/g, ' ').trim().slice(0, 18) || 'Voyageur'; }
function uniqueName(n) {
  let base = cleanName(n), name = base, k = 2;
  while (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) name = base + ' ' + (k++);
  return name;
}
function hostApply(pid, a) {
  if (!S || !a) return 'Action invalide.';
  let err = null;
  const host = pid === S.hostId;
  switch (a.type) {
    case 'addBot': {
      if (!host || S.phase !== 'lobby') { err = 'Réservé à l\'hôte, dans le salon.'; break; }
      if (S.players.length >= E.MAX_PLAYERS) { err = 'Six joueurs au plus autour de la table.'; break; }
      const free = BOTS.NAMES.filter(n => !S.players.some(p => p.name === n));
      const p = E.addPlayer(S, { id: 'b_' + rid(), name: free[Math.floor(E.rnd() * free.length)] || uniqueName('Robot'), bot: true });
      hlog(`${p.name} (robot) s'assoit à la table.`);
      break;
    }
    case 'addLocal': {
      if (!host || S.phase !== 'lobby' || MODE !== 'local') { err = 'Réservé au salon local.'; break; }
      if (S.players.length >= E.MAX_PLAYERS) { err = 'Six joueurs au plus autour de la table.'; break; }
      const p = E.addPlayer(S, { id: 'l_' + rid(), name: uniqueName(a.name), local: true });
      hlog(`${p.name} s'assoit à la table.`);
      break;
    }
    case 'autopilot': {
      if (!host) { err = 'Réservé à l\'hôte.'; break; }
      const q = P(a.target);
      if (!q || q.bot) { err = 'Joueur introuvable.'; break; }
      q.autopilot = !!a.on; q.autoAbs = false;
      hlog(q.autopilot ? `Un robot joue à la place de ${q.name}.` : `${q.name} reprend la main.`);
      break;
    }
    default:
      err = E.act(S, pid, a);
  }
  if (!err) afterChange(a);
  return err;
}
function afterChange(a) {
  if (!S) return;
  if (!a || a.type !== 'preview') saveHost();
  broadcast();
  render();
  scheduleAuto();
}
function saveHost() {
  if (!isHost() || !S) return;
  LS.set('kostky-save', JSON.stringify({ mode: MODE, me: ME, code: S.code, S, t: Date.now() }));
}

const AUTO = { t: null, previewFor: '', guard: 0, guardKey: '' };
function scheduleAuto() {
  clearTimeout(AUTO.t);
  if (!S || !isHost()) return;
  if (S.phase === 'setup') {
    const bot = S.players.find(p => p.bot && !p.ready);
    if (bot) AUTO.t = setTimeout(() => {
      const lo = BOTS.loadout(S);
      hostApply(bot.id, { type: 'loadout', bag: lo.bag, badge: lo.badge, ready: true });
    }, 450 * TIME);
    return;
  }
  if (S.phase !== 'play' || !S.T) return;
  const T = S.T, p = P(T.pid);
  if (!p) return;
  if (p.bot || p.autopilot) {
    let d = 900;
    if (T.phase === 'start') d = 1300;
    else if (T.phase === 'bust') d = 1900;
    else if (T.phase === 'pick') d = AUTO.previewFor === pickKey(T) ? 950 : ROLL_MS + 750;
    AUTO.t = setTimeout(botStep, d * TIME);
    return;
  }
  if (T.phase === 'bust' && !E.rescueKinds(S, p).length) {
    AUTO.t = setTimeout(() => hostApply('sys', { type: 'accept' }), (ROLL_MS + 1700) * TIME);
    return;
  }
  if (MODE === 'host' && !p.connected) {
    AUTO.t = setTimeout(() => {
      if (!S || !S.T || S.T.pid !== p.id || p.connected) return;
      p.autopilot = true; p.autoAbs = true;
      hlog(`${p.name} est absent : un robot joue à sa place.`);
      afterChange();
    }, 25000 * TIME);
  }
}
const pickKey = T => T.rollId + ':' + (T.rerollId || 0);
function botStep() {
  if (!S || S.phase !== 'play' || !S.T) return;
  const T = S.T, pid = T.pid;
  const k = pickKey(T) + T.phase;
  if (AUTO.guardKey === k) AUTO.guard++; else { AUTO.guardKey = k; AUTO.guard = 0; }
  if (AUTO.guard > 6) { hostApply('sys', { type: 'accept' }); return; }
  const a = BOTS.decide(S, pid);
  if (!a) return;
  if (a.type === 'take' && AUTO.previewFor !== pickKey(T)) {
    AUTO.previewFor = pickKey(T);
    E.act(S, pid, { type: 'preview', sel: a.sel });
    afterChange({ type: 'preview' });
    return;
  }
  const err = hostApply(pid, a);
  if (err) {
    console.warn('robot :', err, a);
    if (T.phase === 'bust') hostApply('sys', { type: 'accept' });
    else if (T.phase === 'pick') {
      const subs = E.scoringSubsets(T.dice.map(d => d.v), E.ctxFor(S, P(pid)));
      if (subs.length) hostApply(pid, { type: 'take', sel: subs[0].sel, go: 'bank' });
    } else if (T.phase === 'start') hostApply(pid, { type: 'roll' });
  }
}

  for (const [pid, conn] of NET.conns) {

function onHostData(conn, d) {

    let p = token ? S.players.find(x => x.token === token) : null;
    if (!p) {
      if (S.phase !== 'lobby') { safeSend(conn, { t: 'fatal', msg: 'La partie a déjà commencé. Demande à l\'hôte de revenir au salon.' }); setTimeout(() => conn.close(), 500); return; }

function joinOnline(code, name, silent) {

  if (!window.Peer) { toast(OFFLINE_MSG, true); return; }

  S = null; ME = null;

}
function guestPeer(cb) {
  if (NET.peer && !NET.peer.destroyed && NET.peer.open) { cb(); return; }
  try { if (NET.peer) NET.peer.destroy(); } catch (e) { }

  try { peer = new window.Peer(peerOpts()); } catch (e) { fail(OFFLINE_MSG); return; }

  const to = setTimeout(() => { if (NET.peer === peer && !peer.open) { if (!NET.joined) fail(OFFLINE_MSG); else scheduleRetry(); } }, 12000);
  peer.on('open', () => { clearTimeout(to); if (NET.peer === peer) cb(); });
  peer.on('error', err => {
    if (NET.peer !== peer || NET.closed) return;
    const t = err && err.type;
    if (t === 'peer-unavailable') {
      if (!NET.joined) fail('Aucune table ouverte avec ce code. Vérifie les lettres, ou demande à l\'hôte si sa page est toujours ouverte.');
      else { netBanner('L\'hôte est injoignable. Nouvelle tentative…'); scheduleRetry(); }
    } else if (NETERR.indexOf(t) >= 0) {
      if (!NET.joined) fail(OFFLINE_MSG); else scheduleRetry();
    }

}

    NET.conn = conn;
    const to = setTimeout(() => {
      if (conn.open || NET.conn !== conn) return;
      try { conn.close(); } catch (e) { }
      if (!NET.joined) fail('L\'hôte ne répond pas. Vérifie le code, ou essaie un autre réseau : certains bloquent les connexions directes.');

    conn.on('open', () => { clearTimeout(to); NET.lastMsg = Date.now(); safeSend(conn, { t: 'hello', name: NET.name, token: TOKEN }); });
    conn.on('data', d => { if (NET.conn === conn) onGuestData(d); });

}
function onGuestData(d) {

function guestBeat() {

    case 'toLobby': closeOverlay(); doAct({ type: 'toLobby', as: S.hostId }); break;
    case 'askLobby': closeSheet(); openOverlay('confirm', { title: 'Revenir au salon ?', text: 'La partie en cours sera abandonnée pour tout le monde.', ok: 'Revenir au salon', act: 'toLobby' }); break;
    case 'askLeave': closeSheet(); openOverlay('confirm', { title: MODE === 'host' ? 'Fermer la table ?' : 'Quitter ?', text: MODE === 'host' ? 'Les autres joueurs seront déconnectés et la partie sera perdue.' : (MODE === 'local' ? 'La partie sur cet appareil sera perdue.' : 'Tu pourras revenir avec le même code tant que l\'hôte garde la table ouverte.'), ok: MODE === 'host' ? 'Fermer la table' : 'Quitter', act: 'leave' }); break;
  }
});
function renderBustPick() { Tray.update(); renderDock(); }
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' || ev.key === ' ') {
    const die = ev.target.closest && ev.target.closest('.die-pos');
    if (die) { ev.preventDefault(); onDieTap(+die.dataset.i); }
  }
  if (ev.key === 'Escape') { if (UI.sheet) closeSheet(); else if (UI.ovKind && UI.ovKind !== 'over') closeOverlay(); }
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'joinCode') joinOnline(ev.target.value, nameIn());
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'localName') { const btn = $('[data-act="addLocal"]'); if (btn) btn.click(); }
});
window.addEventListener('resize', () => { if (S && UI.screen === 'game') renderSide(); });

/* ================= Reprise ================= */
function resumeSave() {
  const sv = LS.json('kostky-save');
  if (!sv || !sv.S) { toast('Aucune partie à reprendre.', true); renderHome(); return; }
  S = sv.S; MODE = sv.mode; ME = sv.me;
  UI.seenGame = false; UI.lastFlash = null; Tray.key = null;
  if (MODE === 'host') {
    for (const p of S.players) if (!p.bot && p.id !== S.hostId) p.connected = false;
    SS.set('kostky-live', 'host');
    hostOpen(S.code, true);
  } else SS.set('kostky-live', 'local');
  afterChange();
}
function applyTextures() {
  if (!window.KTex) return;
  window.KTex.load(t => {
    if (!t) return;
    const r = document.documentElement.style;
    r.setProperty('--table-img', `url("${t.table}")`);
    r.setProperty('--tray-img', `url("${t.tray}")`);
    document.documentElement.classList.add('tex');
  });
}
function boot() {
  applyTextures();
  const live = SS.get('kostky-live'), g = SS.json('kostky-guest');
  if (live && LS.json('kostky-save')) { resumeSave(); return; }
  if (g && g.code) { joinOnline(g.code, g.name, true); return; }
  render();
}
window.__kostky = { state: () => S, mode: () => MODE, me: () => ME, act: a => doAct(a), sel: s => { UI.sel = s; Tray.update(); renderDock(); } };
boot();
})();

</script>
